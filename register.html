<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Tasty Delights Fusion Kitchen</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="register.css" /> <!-- unique signup styles -->
  <script>
    function validateSignup(event) {
      event.preventDefault();
      const name = document.getElementById("register-name").value.trim();
      const email = document.getElementById("register-email").value.trim();
      const password = document.getElementById("register-password").value.trim();
      const confirmPassword = document.getElementById("register-confirmPassword").value.trim();

      if (!name || !email || !password || !confirmPassword) {
        alert("All fields are required!");
        return false;
      }
      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return false;
      }

      // ✅ Redirect to register-success.html
      window.location.href = "register-success.html";
    }
  </script>
</head>
<body>
  <header>
    <div class="logo">Tasty Delights Fusion Kitchen</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Order Online</a>
      <a href="reservation.html">Book a Table</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="register-hero">
    <h1>Create Your Account</h1>
    <p>Join Tasty Delights Fusion Kitchen to enjoy personalized offers and faster ordering</p>
  </section>

  <section class="register-container">
    <div class="register-box">
      <h2>Sign Up</h2>
      <form onsubmit="validateSignup(event)">
        <div class="register-field">
          <label for="register-name">Full Name</label>
          <input type="text" id="register-name" name="name" required />
        </div>
        <div class="register-field">
          <label for="register-email">Email Address</label>
          <input type="email" id="register-email" name="email" required />
        </div>
        <div class="register-field">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" name="password" required />
        </div>
        <div class="register-field">
          <label for="register-confirmPassword">Confirm Password</label>
          <input type="password" id="register-confirmPassword" name="confirmPassword" required />
        </div>
        <div class="register-field">
          <button type="submit" class="register-btn">Register</button>
        </div>
        <p class="register-login-link">Already have an account? <a href="login.html">Login here</a></p>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; Tasty Delights Fusion Kitchen. All rights reserved.</p>
  </footer>
</body>
</html>
